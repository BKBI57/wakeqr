name: Ahd
options:
  bundleIdPrefix: com.bkbi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"

targets:
  Ahd:
    type: application
    platform: iOS
    sources:
      - path: Ahd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bkbi.ahd
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
    info:
      path: Ahd/Info.plist
      properties:
        CFBundleDisplayName: "عهد"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]

schemes:
  Ahd:
    build:
      targets:
        Ahd: all
    archive:
      config: Release
