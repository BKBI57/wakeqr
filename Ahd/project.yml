name: Ahd
options:
  bundleIdPrefix: com.bkbi
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "3"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"

targets:
  Ahd:
    type: application
    platform: iOS
    sources:
      - path: Ahd
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bkbi.ahd
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
    info:
      path: Ahd/Info.plist
      properties:
        CFBundleDisplayName: "عهد"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        NSAlarmKitUsageDescription: "عهد بيرن كل يوم وقت الأسئلة، ولحتى تدفع إذا عليك مصاري."
    dependencies:
      - target: AhdWidget

  AhdWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: AhdWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bkbi.ahd.widget
        SKIP_INSTALL: "YES"
    info:
      path: AhdWidget/Info.plist
      properties:
        CFBundleDisplayName: AhdWidget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  Ahd:
    build:
      targets:
        Ahd: all
    archive:
      config: Release
