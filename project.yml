name: WakeQR
options:
  bundleIdPrefix: com.bkbi
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "3"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"

targets:
  WakeQR:
    type: application
    platform: iOS
    sources:
      - path: WakeQR
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bkbi.wakeqr
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
    info:
      path: WakeQR/Info.plist
      properties:
        CFBundleDisplayName: WakeQR
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        NSCameraUsageDescription: "WakeQR needs the camera to scan the QR code that stops the alarm."
        NSAlarmKitUsageDescription: "WakeQR schedules your wake-up alarm."

schemes:
  WakeQR:
    build:
      targets:
        WakeQR: all
    archive:
      config: Release
